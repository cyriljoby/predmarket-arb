[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmarb"
version = "0.1.0"
description = "Event-driven arbitrage detection and backtesting for prediction markets (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12",
    "cryptography>=42",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["pmarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# F  unused imports / names / dead bindings   E,W  pycodestyle
# I  import ordering                          UP   outdated syntax for py311+
# B  likely bugs (mutable defaults, ...)      C4   comprehension rewrites
# RUF unclean asyncio / dataclass patterns
select = ["F", "E", "W", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Feed tests build fakes that must match the real call signatures, so their
# stubs carry arguments they never read.
"tests/*" = ["ARG001", "ARG005"]
